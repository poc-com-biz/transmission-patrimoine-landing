name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Injecter analytics GoatCounter
        run: |
          python3 - <<'PY'
          import glob, datetime
          TAG = '<script data-goatcounter="https://transmission-patrimoine.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>'
          TRACK = '''<script>
          (function(){
            var origFetch = window.fetch ? window.fetch.bind(window) : null;
            if(!origFetch){return;}
            window.fetch = function(url, opts){
              try{
                var u = (typeof url==='string') ? url : ((url && url.url) || '');
                var isPost = opts && opts.method && opts.method.toUpperCase()==='POST';
                var bodyStr = (opts && typeof opts.body==='string') ? opts.body : '';
                var isLeadPage = (u==='.'||u===''||u==='/'||u===window.location.href);
                if(isPost && isLeadPage && bodyStr.indexOf('form-name=lead')>-1){
                  var params = new URLSearchParams(bodyStr);
                  var payload = {'_subject':'Nouveau lead - transmission-patrimoine', '_template':'table', '_captcha':'false'};
                  params.forEach(function(v,k){
                    if(k!=='form-name' && k!=='bot-field' && v!==''){ payload[k]=v; }
                  });
                  payload.page = window.location.href;
                  if(window.goatcounter && window.goatcounter.count){ window.goatcounter.count({path:'formulaire-envoye',event:true}); }
                  return origFetch('https://formsubmit.co/ajax/transmettreclair@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)})
                    .then(function(r){
       
               if(!r.ok){ throw new Error('envoi lead refuse'); }
                      return r;
                    });
                }
              }catch(e){}
              return origFetch.apply(null,arguments);
            };
          })();
          </script>'''
          n = 0
          for f in glob.glob('**/*.html', recursive=True):
              c = open(f, encoding='utf-8').read()
              if 'goatcounter' in c: continue
              c = c.replace('</head>', TAG + '<meta name="google-site-verification" content="W1BkDTyuR8Aio8dikiiq4zATNTa0jc4Xy_sAzYJLcQA" />\n' + '</head>', 1)
              c = c.replace('</body>', TRACK + '</body>', 1)
              open(f, 'w', encoding='utf-8').write(c)
              n += 1
              print('injected', f)
          lines = ['INJECTION OK', 'fichiers modifies: ' + str(n), 'genere: ' + datetime.datetime.utcnow().isoformat()]
          open('buildinfo.txt','w').write(chr(10).join(lines))
          PY
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
