name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Injecter analytics GoatCounter
        run: |
          python3 - <<'PY'
          import glob, datetime
          TAG = '<script data-goatcounter="https://transmission-patrimoine.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>'
          TRACK = '''<script>
(function(){
  var CIBLE='https://transmission-patrimoine.netlify.app/';
  function envoyer(t){
    try{
      var nom='gcenv'+Date.now();
      var fr=document.createElement('iframe');fr.name=nom;fr.style.display='none';
      var nf=document.createElement('form');nf.method='POST';nf.action=CIBLE;nf.target=nom;
      new FormData(t).forEach(function(v,k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;nf.appendChild(i);});
      document.body.appendChild(fr);document.body.appendChild(nf);nf.submit();
      setTimeout(function(){try{document.body.removeChild(fr);document.body.removeChild(nf);}catch(e){}},2000);
    }catch(e){}
  }
  document.addEventListener('submit',function(ev){
    var t=ev.target;
    if(t&&t.getAttribute('data-netlify')==='true'){
      if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:'formulaire-envoye',event:true});}
      envoyer(t);
    }
  },true);
})();
</script>'''
          n = 0
          for f in glob.glob('**/*.html', recursive=True):
              c = open(f, encoding='utf-8').read()
              if 'goatcounter' in c: continue
              c = c.replace('</head>', TAG + '</head>', 1)
              c = c.replace('</body>', TRACK + '</body>', 1)
              open(f, 'w', encoding='utf-8').write(c)
              n += 1
              print('injected', f)
          lines = ['INJECTION OK', 'fichiers modifies: ' + str(n), 'genere: ' + datetime.datetime.utcnow().isoformat()]
          open('buildinfo.txt','w').write(chr(10).join(lines))
          PY
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
