name: Rapport quotidien GoatCounter

on:
  push:
    branches: [main]
    paths: ['.github/workflows/stats.yml']
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer le rapport
        run: |
          python3 - <<'PY'
          import urllib.request, json, datetime, os, sys
          key = os.environ["GOATCOUNTER_API_KEY"]
          base = "https://transmission-patrimoine.goatcounter.com/api/v0"
          yday = (datetime.date.today() - datetime.timedelta(days=1)).isoformat()
          def get(path, params):
              url = base + path + "?" + params
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req))
          def perr(f):
              sys.stderr.write(f + "\n")
          lines = []
          try:
              tot = get("/stats/total", "start=" + yday + "&end=" + yday + "&daily=0")
              pv = tot.get("pageviews") or 0
              vis = tot.get("visitors") or 0
              lines.append("RAPPORT DU " + yday)
              lines.append("")
              lines.append("Visites totales: pages vues " + str(pv) + ", visiteurs uniques " + str(vis))
          except Exception as e:
              perr("erreur /stats/total: " + str(e))
          lines.append("")
          lines.append("VISITES PAR PAGE:")
          pages = {}
          try:
              pg = get("/stats/pages", "start=" + yday + "&end=" + yday)
              rows = pg.get("statistics") or pg.get("rows") or []
              for r in rows:
                  paths = r.get("paths") or []
                  if paths:
                      name = paths[0].get("path", "?")
                      pages[name] = paths[0].get("count") or sum((p.get("count", 0) for p in paths))
          except Exception as e:
              perr("erreur /stats/pages: " + str(e))
          formulaire = pages.pop("/formulaire-envoye", 0) or 0
          if not pages:
              lines.append("- aucune donnee (erreur API ou zero trafic)")
          for name in sorted(pages):
              lines.append("- " + name + " : " + str(pages[name]))
          lines.append("")
          lines.append("FORMULAIRES ENVOYES: " + str(formulaire))
          os.makedirs("stats", exist_ok=True)
          open("stats/rapport-quotidien.txt", "w").write(chr(10).join(lines) + chr(10))
          PY
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/rapport-quotidien.txt
          git commit -m "Rapport quotidien" || echo "rien a committer"
          git push
